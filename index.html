<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Music Sam - Update</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --white: #ffffff; --bg: #000000; --red: #ff0000; --cyan: #00ffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg);
            width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden; color: var(--white);
            perspective: 1200px; /* Diperkecil agar efek 3D lebih tajam */
        }

        #bgCanvas { position: fixed; top: 0; left: 0; z-index: -1; width: 100%; height: 100%; }

        .player-card {
            position: relative;
            width: 90%; max-width: 420px;
            padding: 35px 25px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
            border-radius: 35px;
            transform-style: preserve-3d;
            text-align: center;
            display: flex; flex-direction: column; align-items: center;
        }

        .visualizer-container {
            position: relative;
            width: 240px; height: 240px;
            margin-bottom: 30px;
            display: flex; align-items: center; justify-content: center;
            transform-style: preserve-3d;
        }

        #vCanvas {
            position: absolute;
            width: 800px; height: 800px; 
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) translateZ(-50px);
            pointer-events: none;
            z-index: 1;
        }

        .album-box {
            width: 170px; height: 170px; 
            position: relative; z-index: 5;
            transform-style: preserve-3d;
            cursor: pointer;
            border-radius: 20px;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        #cover { width: 100%; height: 100%; object-fit: cover; border-radius: 20px; filter: contrast(1.1); }

        .info { margin-bottom: 25px; z-index: 11; }
        #title { font-family: 'Orbitron', sans-serif; font-size: 22px; letter-spacing: 4px; margin-bottom: 10px; }
        #artist { opacity: 0.6; font-size: 12px; letter-spacing: 3px; }

        .progress-bar-wrap { width: 100%; height: 4px; background: rgba(255,255,255,0.1); margin: 20px 0; cursor: pointer; }
        #progress { height: 100%; width: 0%; background: #fff; box-shadow: 0 0 15px #fff; }

        .controls { display: flex; justify-content: center; align-items: center; gap: 30px; margin-bottom: 30px; }
        .btn { background: none; border: none; color: #fff; opacity: 0.5; cursor: pointer; transition: 0.3s; }
        .btn:hover, .btn.active { opacity: 1; color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }
        
        .play-pause { 
            width: 70px; height: 70px; border: 2px solid #fff; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; font-size: 24px; 
        }

        .extra-btns { display: flex; justify-content: center; gap: 20px; font-size: 11px; }

        @media (orientation: landscape) and (max-height: 500px) {
            .player-card { transform: scale(0.85); padding: 20px; }
        }
    </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

</div>

    let songIdx = 0, isPlaying = false, isShuffle = false, isRepeat = false;
    const audio = document.getElementById('audio');
    const albumBox = document.getElementById('album-box');
    const coverImg = document.getElementById('cover');
    const titleText = document.getElementById('title');
    const artistText = document.getElementById('artist');
    
    let audioCtx, analyser, dataArray;
    let orbitAngle = 0;
    // Variabel Getaran Smooth
    let shake = { x: 0, y: 0, rX: 0, rY: 0, s: 1 };

    function scramble(el, text) {
        let n = 0;
        const interval = setInterval(() => {
            el.innerText = text.split("").map((c, i) => i < n ? text[i] : "01"[Math.floor(Math.random()*2)]).join("");
            if (n >= text.length) clearInterval(interval);
            n += 1/3;
        }, 30);
    }

    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        const source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        analyser.fftSize = 256;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        renderVisuals();
    }

    function renderVisuals() {
        const vCanvas = document.getElementById('vCanvas');
        const vCtx = vCanvas.getContext('2d');
        vCanvas.width = 1000; vCanvas.height = 1000; 

        const tris = Array.from({ length: 50 }, () => ({
            angle: Math.random() * Math.PI * 2,
            rot: Math.random() * Math.PI,
            speed: (Math.random() - 0.5) * 0.03,
            size: 10 + Math.random() * 15,
            dist: 180 + Math.random() * 120,
            color: Math.random() > 0.5 ? "cyan" : "red" // Pilihan warna
        }));

        function draw() {
            requestAnimationFrame(draw);
            if(audioCtx) analyser.getByteFrequencyData(dataArray);
            
            let bass = dataArray[2] || 0;
            let mid = dataArray[10] || 0;

            // 3D SMOOTH SHAKE LOGIC
            if (bass > 180 && isPlaying) {
                const intens = (bass - 180) / 75;
                shake.x = (Math.random() - 0.5) * 25 * intens;
                shake.y = (Math.random() - 0.5) * 25 * intens;
                shake.rX = (Math.random() - 0.5) * 40 * intens; // Tilt X
                shake.rY = (Math.random() - 0.5) * 40 * intens; // Tilt Y
                shake.s = 1 + (intens * 0.15);
                
                // Add Red/Blue Glitch Shadow
                albumBox.style.boxShadow = `${-5 * intens}px 0 15px var(--red), ${5 * intens}px 0 15px var(--cyan)`;
            } else {
                shake.x *= 0.8; shake.y *= 0.8; shake.rX *= 0.8; shake.rY *= 0.8; shake.s += (1 - shake.s) * 0.1;
                albumBox.style.boxShadow = "0 15px 40px rgba(0,0,0,0.8)";
            }
            albumBox.style.transform = `translate3d(${shake.x}px, ${shake.y}px, 50px) rotateX(${shake.rX}deg) rotateY(${shake.rY}deg) scale(${shake.s})`;

            vCtx.clearRect(0, 0, 1000, 1000);
            orbitAngle += 0.004 + (bass/5000);

            tris.forEach((t, i) => {
                const f = isPlaying ? dataArray[i % 50] : 0;
                const r = t.dist + (bass * 0.5);
                const x = 500 + Math.cos(t.angle + orbitAngle) * r;
                const y = 500 + Math.sin(t.angle + orbitAngle) * r;

                vCtx.save();
                vCtx.translate(x, y);
                vCtx.rotate(t.rot += t.speed);
                vCtx.beginPath();
                const s = t.size * (0.8 + f/150);
                vCtx.moveTo(0, -s); vCtx.lineTo(s, s); vCtx.lineTo(-s, s);
                vCtx.closePath();
                
                const op = 0.1 + (f / 200);
                // Munculkan merah dan biru di visualizer
                vCtx.strokeStyle = t.color === "cyan" ? `rgba(0, 255, 255, ${op})` : `rgba(255, 0, 0, ${op})`;
                vCtx.lineWidth = 1.5;
                
                if(f > 180) {
                    vCtx.shadowBlur = 15;
                    vCtx.shadowColor = t.color === "cyan" ? "cyan" : "red";
                }
                
                vCtx.stroke();
                vCtx.restore();
            });
        }
        draw();
    }

    function loadSong(s) {
        scramble(titleText, s.title.toUpperCase());
        scramble(artistText, s.artist.toUpperCase());
        audio.src = s.file;
        coverImg.src = s.cover;
    }

    function togglePlay() {
        initAudio();
        if (isPlaying) audio.pause(); else audio.play();
        isPlaying = !isPlaying;
        document.getElementById('play-btn').innerText = isPlaying ? '⏸' : '▶';
    }

    function nextSong() {
        songIdx = isShuffle ? Math.floor(Math.random() * songs.length) : (songIdx + 1) % songs.length;
        loadSong(songs[songIdx]); if(isPlaying) audio.play();
    }

    function prevSong() {
        songIdx = (songIdx - 1 + songs.length) % songs.length;
        loadSong(songs[songIdx]); if(isPlaying) audio.play();
    }

    function toggleShuffle() { isShuffle = !isShuffle; document.getElementById('shuffle-btn').classList.toggle('active'); document.getElementById('shuffle-btn').innerText = `SHUFFLE [${isShuffle ? 'ON' : 'OFF'}]`; }
    function toggleRepeat() { isRepeat = !isRepeat; document.getElementById('repeat-btn').classList.toggle('active'); document.getElementById('repeat-btn').innerText = `REPEAT [${isRepeat ? 'ON' : 'OFF'}]`; }

    audio.onended = () => { if (isRepeat) audio.play(); else nextSong(); };
    
    const progCont = document.getElementById('progress-container');
    progCont.onclick = (e) => { audio.currentTime = (e.offsetX / progCont.clientWidth) * audio.duration; };
    audio.ontimeupdate = () => { if(audio.duration) document.getElementById('progress').style.width = (audio.currentTime / audio.duration) * 100 + '%'; };

    const bgC = document.getElementById('bgCanvas');
    const bgCtx = bgC.getContext('2d');
    function resize() { bgC.width = window.innerWidth; bgC.height = window.innerHeight; }
    window.onresize = resize; resize();
    
    function animBg() {
        bgCtx.fillStyle = 'rgba(0,0,0,0.1)'; bgCtx.fillRect(0,0,bgC.width,bgC.height);
        for(let i=0; i<5; i++) {
            bgCtx.fillStyle = 'rgba(255,255,255,0.3)';
            bgCtx.beginPath(); bgCtx.arc(Math.random()*bgC.width, Math.random()*bgC.height, 0.8, 0, 7); bgCtx.fill();
        }
        requestAnimationFrame(animBg);
    }
    animBg(); loadSong(songs[0]);
</script>
</body>
</html>
