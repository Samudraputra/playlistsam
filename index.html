<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Sam - Fix Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --white: #ffffff; --bg: #000000; --red: #ff0000; --cyan: #00ffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden; color: var(--white);
            perspective: 2000px; 
        }

        #bgCanvas { position: fixed; top: 0; left: 0; z-index: -1; }

        .player-card {
            position: relative;
            width: 90%;
            max-width: 500px;
            padding: 40px 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
            border-radius: 30px;
            transform-style: preserve-3d;
            text-align: center;
        }

        .visualizer-container {
            position: relative;
            width: 220px; height: 220px;
            margin: 0 auto 30px;
            display: flex; align-items: center; justify-content: center;
            transform-style: preserve-3d;
        }

        /* FIX: Canvas sekarang menutupi area visualizer dengan benar */
        #vCanvas {
            position: absolute;
            width: 600px; height: 600px; /* Ukuran tetap yang besar agar orbit tidak terpotong */
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) translateZ(-50px);
            pointer-events: none;
            z-index: 1;
        }

        .album-box {
            width: 180px; height: 180px; 
            position: relative; z-index: 5;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        #cover { 
            width: 100%; height: 100%; 
            object-fit: cover; 
            filter: grayscale(100%) contrast(1.2);
            border-radius: 10px;
        }

        .info { margin-bottom: 30px; }
        #title { font-family: 'Orbitron', sans-serif; font-size: 22px; letter-spacing: 5px; margin-bottom: 10px; text-transform: uppercase; }
        #artist { opacity: 0.5; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; }

        .progress-bar-wrap { width: 100%; height: 4px; background: rgba(255,255,255,0.1); margin: 30px 0; cursor: pointer; border-radius: 2px; }
        #progress { height: 100%; width: 0%; background: #fff; box-shadow: 0 0 10px #fff; border-radius: 2px; }

        .controls { display: flex; justify-content: center; align-items: center; gap: 30px; margin-bottom: 25px; }
        .btn { background: none; border: none; color: #fff; opacity: 0.5; cursor: pointer; transition: 0.3s; font-family: 'Share Tech Mono'; }
        .btn:hover, .btn.active { opacity: 1; color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }
        
        .btn-large { font-size: 28px; }
        .play-pause { 
            width: 70px; height: 70px; 
            border: 2px solid #fff; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 24px; opacity: 1;
        }

        .extra-btns { display: flex; justify-content: center; gap: 20px; font-size: 11px; }
    </style>
</head>

    <div class="info">

    <div class="controls">

        <button class="btn play-pause" id="play-btn" onclick="togglePlay()">▶</button>

    </div>

    <div class="extra-btns">

        <button class="btn" id="repeat-btn" onclick="toggleRepeat()">REPEAT [OFF]</button>
    </div>
</div>

    let songIdx = 0, isPlaying = false, isShuffle = false, isRepeat = false, hasRepeated = false;
    const audio = document.getElementById('audio');
    const albumBox = document.getElementById('album-box');
    const coverImg = document.getElementById('cover');
    const titleText = document.getElementById('title');
    const artistText = document.getElementById('artist');
    
    let audioCtx, analyser, dataArray;
    let orbitAngle = 0;
    let curX = 0, curY = 0, curZ = 0;

    function scramble(el, text) {
        let n = 0;
        const interval = setInterval(() => {
            el.innerText = text.split("").map((c, i) => i < n ? text[i] : "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"[Math.floor(Math.random()*36)]).join("");
            if (n >= text.length) clearInterval(interval);
            n += 1/3;
        }, 30);
    }

    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        const source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        analyser.fftSize = 512;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        renderVisuals();
    }

    function renderVisuals() {
        const vCanvas = document.getElementById('vCanvas');
        const vCtx = vCanvas.getContext('2d');
        vCanvas.width = 600; vCanvas.height = 600; // Ukuran koordinat internal canvas

        const tris = Array.from({ length: 30 }, () => ({
            angle: Math.random() * Math.PI * 2,
            rot: Math.random() * Math.PI,
            speed: (Math.random() - 0.5) * 0.05,
            size: 15 + Math.random() * 20
        }));

        function draw() {
            requestAnimationFrame(draw);
            if(audioCtx) analyser.getByteFrequencyData(dataArray);
            let bass = 0;
            for(let i=0; i<10; i++) bass += dataArray[i];
            bass /= 10;

            // Efek guncang album
            if (bass > 170 && isPlaying) {
                const intens = (bass - 170) / 80;
                curX = (Math.random() - 0.5) * 30 * intens;
                curY = (Math.random() - 0.5) * 30 * intens;
                curZ = 40 * intens;
                albumBox.style.boxShadow = `0 0 50px rgba(255,0,0,${intens}), 0 0 20px rgba(0,255,255,${intens})`;
            } else {
                curX *= 0.9; curY *= 0.9; curZ *= 0.9;
                albumBox.style.boxShadow = "0 20px 50px rgba(0,0,0,0.5)";
            }
            albumBox.style.transform = `translate3d(${curX}px, ${curY}px, ${curZ}px)`;

            // Gambar visualizer
            vCtx.clearRect(0, 0, 600, 600);
            const cx = 300, cy = 300; // Titik tengah canvas
            orbitAngle += 0.01;

            tris.forEach((t, i) => {
                const f = isPlaying ? dataArray[i % 100] : 0;
                const r = 18 + (bass * 0.6) + (f * 0.4);
                const x = cx + Math.cos(t.angle + orbitAngle) * r;
                const y = cy + Math.sin(t.angle + orbitAngle) * r;

                vCtx.save();
                vCtx.translate(x, y);
                vCtx.rotate(t.rot += t.speed);
                vCtx.beginPath();
                const s = t.size * (0.8 + f/200);
                vCtx.moveTo(0, -s); vCtx.lineTo(s, s); vCtx.lineTo(-s, s);
                vCtx.closePath();
                vCtx.strokeStyle = bass > 180 ? `rgba(0,255,255,0.6)` : `rgba(255,255,255,0.3)`;
                // Garis akan menebal otomatis saat ada bass/frekuensi tinggi
                vCtx.lineWidth = 1 + (f / 50);
                vCtx.stroke();
                vCtx.restore();
            });
        }
        draw();
    }

    function loadSong(s) {
        scramble(titleText, s.title.toUpperCase());
        scramble(artistText, s.artist.toUpperCase());
        audio.src = s.file;
        coverImg.src = s.cover;
        hasRepeated = false;
    }

    function togglePlay() {
        initAudio();
        if (isPlaying) audio.pause(); else audio.play();
        isPlaying = !isPlaying;
        document.getElementById('play-btn').innerText = isPlaying ? '⏸' : '▶';
    }

    function nextSong() {
        if (isShuffle) songIdx = Math.floor(Math.random() * songs.length);
        else songIdx = (songIdx + 1) % songs.length;
        loadSong(songs[songIdx]);
        if(isPlaying) audio.play();
    }

    function prevSong() {
        songIdx = (songIdx - 1 + songs.length) % songs.length;
        loadSong(songs[songIdx]);
        if(isPlaying) audio.play();
    }

    function toggleShuffle() {
        isShuffle = !isShuffle;
        document.getElementById('shuffle-btn').innerText = `SHUFFLE [${isShuffle ? 'ON' : 'OFF'}]`;
        document.getElementById('shuffle-btn').classList.toggle('active');
    }

    function toggleRepeat() {
        isRepeat = !isRepeat;
        document.getElementById('repeat-btn').innerText = `REPEAT [${isRepeat ? 'ON' : 'OFF'}]`;
        document.getElementById('repeat-btn').classList.toggle('active');
    }

    audio.onended = () => {
        if (isRepeat && !hasRepeated) { hasRepeated = true; audio.play(); }
        else nextSong();
    };

    const progCont = document.getElementById('progress-container');
    progCont.onclick = (e) => { audio.currentTime = (e.offsetX / progCont.clientWidth) * audio.duration; };
    audio.ontimeupdate = () => { document.getElementById('progress').style.width = (audio.currentTime / audio.duration) * 100 + '%'; };

    // Star BG logic
    const bgC = document.getElementById('bgCanvas');
    const bgCtx = bgC.getContext('2d');
    let stars = [];
    function resize() { bgC.width = window.innerWidth; bgC.height = window.innerHeight; stars = Array.from({length:200}, () => ({x:Math.random()*bgC.width, y:Math.random()*bgC.height, z:Math.random()*bgC.width})); }
    function animBg() {
        bgCtx.fillStyle = '#000'; bgCtx.fillRect(0,0,bgC.width,bgC.height);
        stars.forEach(s => {
            s.z -= 2; if(s.z<=0) s.z = bgC.width;
            bgCtx.fillStyle = 'rgba(255,255,255,0.3)';
            bgCtx.beginPath(); bgCtx.arc(s.x, s.y, 1, 0, 7); bgCtx.fill();
        });
        requestAnimationFrame(animBg);
    }
    window.onresize = resize; resize(); animBg(); loadSong(songs[0]);
