<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Sam - Pro Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --white: #ffffff; --bg: #000000; --red: #ff0000; --cyan: #00ffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }

        body {
            background: var(--bg);
            height: 100vh;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden; color: var(--white);
            perspective: 2000px; 
        }

        #bgCanvas { position: fixed; top: 0; left: 0; z-index: -1; }

        .player-card {
            position: relative;
            width: 650px;
            padding: 50px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(50px);
            border: 1px solid rgba(255,255,255,0.05);
            z-index: 10;
            border-radius: 40px;
            transform-style: preserve-3d;
            box-shadow: 0 50px 150px rgba(0,0,0,1);
        }

        .visualizer-container {
            position: relative;
            width: 350px; height: 350px;
            margin: 0 auto 10px;
            display: flex; align-items: center; justify-content: center;
            transform-style: preserve-3d;
        }

        #vCanvas {
            position: absolute;
            width: 450%; height: 450%; 
            z-index: 1;
            filter: drop-shadow(0 0 30px rgba(255,255,255,0.3));
            pointer-events: none;
            transform: translateZ(-150px); 
        }

        .album-box {
            width: 240px; height: 240px; 
            position: relative; z-index: 5;
            background: #000;
            transform-style: preserve-3d;
            will-change: transform;
            cursor: pointer;
        }

        #cover { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%) contrast(1.2); border: 1px solid rgba(255,255,255,0.1); }

        .info { text-align: center; transform: translateZ(100px); margin-top: 25px; min-height: 80px; }
        #title { font-family: 'Orbitron', sans-serif; font-size: 28px; letter-spacing: 10px; font-weight: 700; text-transform: uppercase; display: block; }
        #artist { opacity: 0.4; font-size: 11px; letter-spacing: 6px; margin-top: 10px; text-transform: uppercase; }

        .progress-bar-wrap { width: 100%; height: 3px; background: rgba(255,255,255,0.1); margin: 40px 0; cursor: pointer; transform: translateZ(50px); }
        #progress { height: 100%; width: 0%; background: #fff; box-shadow: 0 0 15px #fff; }

        /* CONTROLS AREA */
        .controls { display: flex; justify-content: space-around; align-items: center; transform: translateZ(120px); }
        
        .btn { 
            background: none; border: none; color: #fff; opacity: 0.4; 
            transition: 0.3s; font-family: 'Share Tech Mono'; cursor: pointer; 
            font-size: 16px; font-weight: bold;
        }
        .btn:hover, .btn.active { opacity: 1; text-shadow: 0 0 15px #fff; color: var(--cyan); }
        
        .play-pause { 
            width: 85px; height: 85px; 
            border: 2px solid #fff; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 32px; opacity: 1;
        }
        .play-pause:hover { background: #fff; color: #000; transform: scale(1.1); }

        .extra-btns { margin-top: 20px; display: flex; justify-content: center; gap: 40px; transform: translateZ(100px); }
    </style>
</head>

    <div class="controls">

        <button class="btn play-pause" id="play-btn" onclick="togglePlay()">▶</button>

    </div>

    <div class="extra-btns">

        <button class="btn" id="repeat-btn" onclick="toggleRepeat()" title="Repeat 1x then Next">REPEAT [OFF]</button>

    let songIdx = 0, isPlaying = false, isShuffle = false, isRepeat = false, hasRepeated = false;
    const audio = document.getElementById('audio');
    const albumBox = document.getElementById('album-box');
    const coverImg = document.getElementById('cover');
    const titleText = document.getElementById('title');
    const artistText = document.getElementById('artist');
    const shuffleBtn = document.getElementById('shuffle-btn');
    const repeatBtn = document.getElementById('repeat-btn');

    let audioCtx, analyser, dataArray;
    let orbitAngle = 0;
    let curX = 0, curY = 0, curZ = 0, curRotX = 0, curRotY = 0;
    const lerpSpeed = 0.08;

    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    function scramble(targetElement, finalWord) {
        let iteration = 0;
        const interval = setInterval(() => {
            targetElement.innerText = finalWord.split("").map((char, index) => {
                if (index < iteration) return finalWord[index];
                return chars[Math.floor(Math.random() * chars.length)];
            }).join("");
            if (iteration >= finalWord.length) clearInterval(interval);
            iteration += 1 / 3;
        }, 30);
    }

    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        const source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        analyser.fftSize = 512;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        renderVisuals();
    }

    function renderVisuals() {
        const vCanvas = document.getElementById('vCanvas');
        const vCtx = vCanvas.getContext('2d');
        vCanvas.width = 2000; vCanvas.height = 2000;
        const tris = Array.from({ length: 32 }, (_, i) => ({
            baseAngle: (i / 32) * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.1,
            rotation: Math.random() * Math.PI,
            size: 40 + Math.random() * 50
        }));

        function draw() {
            requestAnimationFrame(draw);
            if(audioCtx) analyser.getByteFrequencyData(dataArray);
            let bass = 0;
            for(let i=0; i<10; i++) bass += dataArray[i];
            bass /= 10;

            if (bass > 165 && isPlaying) {
                const intens = (bass - 165) / 90;
                curX += ((Math.random() - 0.5) * 120 * intens - curX) * lerpSpeed;
                curY += ((Math.random() - 0.5) * 120 * intens - curY) * lerpSpeed;
                curZ += (200 * intens - curZ) * lerpSpeed;
                albumBox.style.boxShadow = `${-20 * intens}px 0 60px rgba(255,0,0,${0.6 * intens}), ${20 * intens}px 0 60px rgba(0,255,255,${0.6 * intens})`;
            } else {
                curX *= 0.9; curY *= 0.9; curZ *= 0.9;
                albumBox.style.boxShadow = "0 40px 100px rgba(0,0,0,0.8)";
            }
            albumBox.style.transform = `translate3d(${curX}px, ${curY}px, ${curZ}px) rotateX(${curRotX}deg) rotateY(${curRotY}deg)`;

            vCtx.clearRect(0, 0, 2000, 2000);
            orbitAngle += 0.006 + (bass / 4000);
            tris.forEach((t, i) => {
                const freq = isPlaying ? dataArray[i % 128] : 0;
                const radius = 14 + (bass * 0.8) + (freq * 0.5); // Jarak segitiga
                const x = 1000 + Math.cos(t.baseAngle + orbitAngle) * radius;
                const y = 1000 + Math.sin(t.baseAngle + orbitAngle) * radius;
                vCtx.save(); vCtx.translate(x, y); vCtx.rotate(t.rotation += t.rotSpeed + (bass / 1200));
                const s = t.size * (0.8 + freq/255);
                vCtx.beginPath(); vCtx.moveTo(0, -s/2); vCtx.lineTo(s/2, s/2); vCtx.lineTo(-s/2, s/2); vCtx.closePath();
                vCtx.strokeStyle = `rgba(255, 255, 255, ${0.2 + freq/200})`; vCtx.lineWidth = 3; vCtx.stroke();
                vCtx.restore();
            });
        }
        draw();
    }

    function togglePlay() {
        initAudio();
        if (isPlaying) audio.pause(); else audio.play();
        isPlaying = !isPlaying;
        document.getElementById('play-btn').innerText = isPlaying ? '⏸' : '▶';
    }

    function loadSong(song) {
        scramble(titleText, song.title.toUpperCase());
        scramble(artistText, song.artist.toUpperCase());
        audio.src = song.file;
        coverImg.src = song.cover;
        hasRepeated = false; // Reset status pengulangan untuk lagu baru
    }

    function nextSong() {
        if (isShuffle) {
            songIdx = Math.floor(Math.random() * songs.length);
        } else {
            songIdx = (songIdx + 1) % songs.length;
        }
        loadSong(songs[songIdx]);
        if(isPlaying) audio.play();
    }

    function prevSong() {
        songIdx = (songIdx - 1 + songs.length) % songs.length;
        loadSong(songs[songIdx]);
        if(isPlaying) audio.play();
    }

    function toggleShuffle() {
        isShuffle = !isShuffle;
        shuffleBtn.classList.toggle('active');
        shuffleBtn.innerText = isShuffle ? "SHUFFLE [ON]" : "SHUFFLE [OFF]";
    }

    function toggleRepeat() {
        isRepeat = !isRepeat;
        repeatBtn.classList.toggle('active');
        repeatBtn.innerText = isRepeat ? "REPEAT [ON]" : "REPEAT [OFF]";
    }

    // LOGIKA AUTO-NEXT & REPEAT
    audio.onended = () => {
        if (isRepeat && !hasRepeated) {
            hasRepeated = true;
            audio.currentTime = 0;
            audio.play();
        } else {
            nextSong();
        }
    };

    const progressContainer = document.getElementById('progress-container');
    progressContainer.addEventListener('click', (e) => {
        const width = progressContainer.clientWidth;
        const clickX = e.offsetX;
        if(audio.duration) audio.currentTime = (clickX / width) * audio.duration;
    });

    audio.ontimeupdate = () => { if(audio.duration) document.getElementById('progress').style.width = (audio.currentTime / audio.duration) * 100 + '%'; };

    // Starfield BG
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let stars = [];
    function initStars() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        stars = Array.from({length: 250}, () => ({ x: Math.random()*canvas.width-canvas.width/2, y: Math.random()*canvas.height-canvas.height/2, z: Math.random()*canvas.width }));
    }
    function drawStars() {
        ctx.fillStyle = "black"; ctx.fillRect(0,0, canvas.width, canvas.height);
        ctx.save(); ctx.translate(canvas.width/2, canvas.height/2);
        stars.forEach(s => { s.z -= 6; if(s.z <= 0) s.z = canvas.width;
            let x = s.x / (s.z / canvas.width); let y = s.y / (s.z / canvas.width);
            ctx.fillStyle = "rgba(255,255,255,0.3)"; ctx.beginPath(); ctx.arc(x, y, 1.5, 0, Math.PI*2); ctx.fill();
        });
        ctx.restore(); requestAnimationFrame(drawStars);
    }
    window.onresize = initStars; initStars(); drawStars(); loadSong(songs[0]);
